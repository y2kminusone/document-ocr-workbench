<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Preview</title>
    <style>
      :root {
        --bg: #0b1020;
        --text: #e7eaf0;
        --border: rgba(255, 255, 255, 0.10);
      }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 1rem 1rem; /* 상단 바 고려 + 좌우 여백 */
        overflow: hidden;
        background: var(--bg);
        box-sizing: border-box;
      }

      img {
        max-width: calc(100vw - 2rem);
        max-height: calc(100vh - 56px - 2rem);
        object-fit: contain;
        transform-origin: center;
        box-sizing: border-box;

        /* 🔴 추가: 회전 시에도 중앙 유지 */
        margin: 0;
        display: block;
        transition : transform 0.1s ease-out;
      }


      .bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        height: 56px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 12px;
        background: rgba(11, 16, 32, 0.82);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .left { display: inline-flex; gap: 10px; align-items: center; min-width: 0; }
      .title { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 44vw; }
      .deg { font-size: 12px; opacity: 0.8; }
      .btns { display: inline-flex; gap: 8px; align-items: center; }
      button {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        font-weight: 800;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,0.10); }
      button:active { transform: translateY(0.5px); }
      .btn-danger { border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.10); }
      .btn-ghost { background: transparent; }

      .hint { opacity: 0.75; font-size: 12px; padding: 14px; max-width: 900px; }
      code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="left">
        <div class="title" id="title"></div>
        <div class="deg" id="degLabel"></div>
      </div>
      <div class="btns">
        <button id="btnCcw" title="반시계 90° (←)">⟲ 90°</button>
        <button id="btnCw" title="시계 90° (→)">⟳ 90°</button>
        <button id="btn180" title="180°">180°</button>
        <button id="btnReset" class="btn-ghost" title="원래대로 (0°)">Reset</button>
        <button id="btnClose" class="btn-danger" title="닫기 (Esc)">닫기</button>
      </div>
    </div>

    <div class="wrap" id="wrap">
      <img id="img" alt="" referrerpolicy="no-referrer" />
    </div>
    <script>
      (function () {
        const qs = new URLSearchParams(location.search || "");
        const src = qs.get("src") || "";
        const rot = (qs.get("rot") || "").trim().toLowerCase();
        const title = qs.get("title") || document.title || "Preview";
        const degParam = qs.get("deg");
    
        const titleEl = document.getElementById("title");
        const img = document.getElementById("img");
        const degLabel = document.getElementById("degLabel");
        const wrap = document.getElementById("wrap");
    
        let deg = 0;
        let zoom = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;
    
        function normalizeDeg(d) {
          let x = ((d % 360) + 360) % 360;
          if (x > 180) x -= 360;
          return x;
        }
    
        function rotToDeg(r) {
          if (!r) return 0;
          if (r === "cw") return 90;
          if (r === "ccw") return -90;
          if (r === "180") return 180;
          return 0;
        }
    
        if (degParam != null && degParam !== "") {
          const n = Number(degParam);
          deg = Number.isFinite(n) ? n : 0;
        } else {
          deg = rotToDeg(rot);
        }

        const initialDeg = deg;
    
        document.title = title || "Preview";
        if (titleEl) titleEl.textContent = title || "Preview";
    
        if (!src) {
          if (wrap) {
            const hint = document.createElement("div");
            hint.className = "hint";
            hint.textContent = "이미지 URL이 전달되지 않았습니다. (쿼리스트링 src 필요)";
            wrap.innerHTML = "";
            wrap.appendChild(hint);
          }
          return;
        }
    
        img.src = src;
    
        function clamp(n, min, max) {
          return Math.max(min, Math.min(max, n));
        }
    
        function applyTransform() {
          const d = normalizeDeg(deg);
          const isRotated = Math.abs(d) % 180 !== 0;
          const maxW = isRotated ? "calc(100vh - 56px - 2rem)" : "calc(100vw - 2rem)";
          const maxH = isRotated ? "calc(100vw - 2rem)" : "calc(100vh - 56px - 2rem)";

          img.style.maxWidth = maxW;
          img.style.maxHeight = maxH;
          img.style.transform = `rotate(${d}deg) translate(${translateX}px, ${translateY}px) scale(${zoom})`;
          img.style.transformOrigin = "center";

          // 확대 상태면 grab 커서
          img.style.cursor = zoom > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';

          if (degLabel) {
            const zoomText = zoom > 1 ? `, 확대: ${zoom.toFixed(2)}배` : "";
            degLabel.textContent = `각도: ${d}°${zoomText}`;
          }
        }

        // function applyTransform() {
        //   const d = normalizeDeg(deg);
        //   const isRotated = Math.abs(d) % 180 !== 0;
        //   const maxW = isRotated ? "calc(100vh - 56px - 2rem)" : "calc(100vw - 2rem)";
        //   const maxH = isRotated ? "calc(100vw - 2rem)" : "calc(100vh - 56px - 2rem)";
    
        //   img.style.maxWidth = maxW;
        //   img.style.maxHeight = maxH;
        //   img.style.transform = `rotate(${d}deg) translate(${translateX}px, ${translateY}px) scale(${zoom})`;
        //   img.style.transformOrigin = "center";
    
        //   img.style.cursor = zoom > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
    
        //   if (degLabel) {
        //     const zoomText = zoom > 1 ? `, 확대: ${zoom.toFixed(2)}배` : "";
        //     degLabel.textContent = `각도: ${d}°${zoomText}`;
        //   }
        // }
    
        // wheel: Ctrl + 휠로 확대/축소
        document.addEventListener("wheel", (e) => {
          if (!e.ctrlKey) return;
          e.preventDefault();
          const step = 0.12;
          zoom = clamp(zoom + (e.deltaY < 0 ? step : -step), 0.2, 6);
          applyTransform();
        }, { passive: false });
  
        // 드래그 시작
        img.addEventListener("mousedown", (e) => {
          if (zoom <= 1) return;
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          // 현재 translate 값을 기준으로 유지
          initialTranslateX = translateX;
          initialTranslateY = translateY;
          img.style.cursor = 'grabbing';
          e.preventDefault();
        });

        // 드래그 중
        document.addEventListener("mousemove", (e) => {
          if (!isDragging) return;

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          // 현재 회전 각도에 따라 이동 방향을 변환
          const rad = (deg * Math.PI) / 180;
          const cos = Math.cos(rad);
          const sin = Math.sin(rad);

          // 화면상 드래그를 회전된 좌표계 기준으로 변환
          translateX = initialTranslateX + (dx * cos + dy * sin);
          translateY = initialTranslateY + (-dx * sin + dy * cos);

          applyTransform();
        });

        // 드래그 종료
        document.addEventListener("mouseup", () => {
          isDragging = false;
          img.style.cursor = zoom > 1 ? 'grab' : 'default';
        });

        document.addEventListener("mouseleave", () => {
          if (isDragging) {
            isDragging = false;
            img.style.cursor = zoom > 1 ? 'grab' : 'default';
          }
        });


    
        // 더블클릭: 리셋
        img.addEventListener("dblclick", () => {
          deg = 0;
          zoom = 1;
          translateX = 0;
          translateY = 0;
          applyTransform();
        });
    
        // 키보드 제어
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") { window.close(); return; }
          if (e.key === "ArrowRight") { deg += 90; applyTransform(); return; }
          if (e.key === "ArrowLeft") { deg -= 90; applyTransform(); return; }
          if (e.key === "0") { 
            deg = 0; 
            zoom = 1; 
            translateX = 0; 
            translateY = 0; 
            applyTransform(); 
            return; 
          }
          if (e.key === "+" || e.key === "=") { zoom = clamp(zoom + 0.12, 0.2, 6); applyTransform(); return; }
          if (e.key === "-") { zoom = clamp(zoom - 0.12, 0.2, 6); applyTransform(); return; }
        });
    
        // 버튼 이벤트
        document.getElementById("btnCcw").addEventListener("click", () => { deg -= 90; applyTransform(); });
        document.getElementById("btnCw").addEventListener("click", () => { deg += 90; applyTransform(); });
        document.getElementById("btn180").addEventListener("click", () => { deg += 180; applyTransform(); });
        document.getElementById("btnReset").addEventListener("click", () => {
          deg = initialDeg;
          zoom = 1;
          translateX = 0;
          translateY = 0;
          applyTransform();
        });
        document.getElementById("btnClose").addEventListener("click", () => window.close());
    
        // 초기 적용
        applyTransform();
      })();
    </script>
